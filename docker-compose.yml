name: solaruy

# Stack de runtime de la aplicación.
# Es lo único que se despliega y escala; el stack de calidad (SonarQube) vive
# aparte en ControlCalidad/SonarQube/docker-compose.yml.
#
#   docker compose up -d        -> mysql + migrate + redis + app(replicas) + nginx + simulador   (http://localhost:5080)
#   docker compose run --rm tools dotnet test
#
# Variables: ver .env.example

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definí MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-SolarUY}
      MYSQL_USER: ${MYSQL_APP_USER:-solaruy}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?definí MYSQL_APP_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - solaruy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - solaruy

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    environment:
      DOTNET_CLI_HOME: /tmp/dh
      NUGET_PACKAGES: /nuget
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SolarUYDb: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-SolarUY};User=${MYSQL_APP_USER:-solaruy};Password=${MYSQL_APP_PASSWORD};"
    volumes:
      - .:/app
      - ./.docker-cache/nuget:/nuget
    depends_on:
      mysql:
        condition: service_healthy
    command: >-
      bash -lc "dotnet tool restore &&
                dotnet restore SolarUY.sln &&
                dotnet ef database update --project SolarUY --startup-project SolarUY"
    restart: "no"
    networks:
      - solaruy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SolarUYDb: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-SolarUY};User=${MYSQL_APP_USER:-solaruy};Password=${MYSQL_APP_PASSWORD};"
      ConnectionStrings__Redis: redis:6379
      SimulacionApi__ApiKey: ${SIMULACION_API_KEY:-SolarUY.Local2026}
    deploy:
      replicas: ${APP_REPLICAS:-2}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - solaruy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-5080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - solaruy

  # Mock del inversor: componente independiente. No accede a MySQL; obtiene la topología de `app`
  # y le envía la telemetría por HTTP al balanceador (req012).
  simulador:
    build:
      context: .
      dockerfile: docker/Dockerfile.simulador
    restart: unless-stopped
    environment:
      SimulacionApi__UrlBase: http://nginx:80
      SimulacionApi__ApiKey: ${SIMULACION_API_KEY:-SolarUY.Local2026}
    depends_on:
      nginx:
        condition: service_started
    networks:
      - solaruy

  tools:
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
    profiles:
      - tools
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    environment:
      DOTNET_CLI_HOME: /tmp/dh
      NUGET_PACKAGES: /nuget
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SolarUYDb: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-SolarUY};User=${MYSQL_APP_USER:-solaruy};Password=${MYSQL_APP_PASSWORD};"
    volumes:
      - .:/app
      - ./.docker-cache/nuget:/nuget
    networks:
      - solaruy

networks:
  solaruy:

volumes:
  mysqldata:
